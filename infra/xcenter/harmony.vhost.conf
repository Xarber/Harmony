# SPDX-License-Identifier: AGPL-3.0-only
server {
    listen 80;
    server_name harmony.xcenter.it;
    return 301 https://harmony.xcenter.it$request_uri;
}
server {
    listen 443 ssl;
    server_name harmony.xcenter.it;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    root /srv/xcenter/apps/harmony/current;
    index index.html;
    access_log off;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health { default_type text/plain; return 200 "ok\n"; }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
